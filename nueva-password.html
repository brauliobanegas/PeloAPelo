<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nueva contraseña - PeloAPelo</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body>


<div class="contenedorCuenta">


    <div class="marcaCuenta">

        <h1 class="logo">
            <span class="logoCeleste">Pe</span><span class="logoBlanco">lo</span><span class="logoAmarillo">A</span><span class="logoBlanco">Pe</span><span class="logoCeleste">lo</span>
        </h1>

        <p class="eslogan">
            Segundas vidas. Nuevos tesoros
        </p>

    </div>



    <div class="tarjetaCuenta">


        <h2>Nueva contraseña</h2>


        <form id="formNuevaPassword">


            <label>
                Nueva contraseña:
                <div class="campoPassword">

                    <input 
                    type="password" 
                    id="nuevaPassword"
                    required>

                    <button type="button" id="mostrarNuevaPassword">
                        👁
                    </button>

                </div>
            </label>


            <label>
                Repetir contraseña:
                <div class="campoPassword">

                    <input 
                    type="password" 
                    id="repetirPassword"
                    required>

                    <button type="button" id="mostrarRepetirPassword">
                        👁
                    </button>

                </div>
            </label>


            <button type="submit" class="btnCuenta">
                Guardar contraseña
            </button>


        </form>


        <p id="mensaje"></p>


    </div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="nueva-password.js"></script>


</body>

</html>
