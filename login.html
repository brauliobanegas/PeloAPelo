<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - PeloAPelo</title>
    <link rel="stylesheet" href="styles.css">
</head>

    <div class="contenedorCuenta">


        <div class="marcaCuenta">
        
        <h1 class="logo">
            <span class="logoCeleste">Pe</span><span class="logoBlanco">lo</span><span class="logoAmarillo">A</span><span class="logoBlanco">Pe</span><span class="logoCeleste">lo</span>
        </h1>

        <p class="eslogan">
            Segundas vidas. Nuevos tesoros
        </p>

    </div>



    <div class="tarjetaCuenta">


        <h2>Ingresar</h2>


        <form id="formLogin">


            <label>
                Email:
                <input type="email" id="email" required>
            </label>


            <label>
                Contraseña:

                <div class="campoPassword">

                    <input type="password" id="password" required>

                    <button type="button" id="mostrarPassword">
                        👁
                    </button>

                </div>

            </label>


            <button type="submit">
                Ingresar
            </button>


        </form>


        <p id="mensaje"></p>

        <p class="enlaceCuenta">
            ¿No tenés cuenta?
            <a href="registro.html">Registrate</a>
        </p>


    </div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="login.js"></script>
</html>
