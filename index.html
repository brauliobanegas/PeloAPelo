<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TruequeAR</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>

<header class="encabezado">

    <h1 class="logo">
        <span class="logoTrueque">Trueque</span><span class="logoAR">AR</span>
    </h1>

    <p>Segundas vidas. Nuevos tesoros</p>

</header>

<!-- ==========================
     BUSCADOR
========================== -->

<section class="formulario">
    <h2>Explorá publicaciones</h2>
    <p class="subtituloBusqueda">
    Encontrá lo que necesitás filtrando por nombre o categoría.
    </p>
    <div class="contenedorBuscador">

    <span class="iconoBusqueda">🔍</span>

    <input
        id="buscador"
        type="text"
        placeholder="Buscar publicaciones...">

</div>

    <div id="chipsCategorias" class="chips-categorias">

        <button class="chip activo" data-categoria="">Todas</button>
        <button class="chip" data-categoria="Hogar">Hogar</button>
        <button class="chip" data-categoria="Herramientas">Herramientas</button>
        <button class="chip" data-categoria="Electrónica">Electrónica</button>
        <button class="chip" data-categoria="Vehículos">Vehículos</button>
        <button class="chip" data-categoria="Deportes">Deportes</button>
        <button class="chip" data-categoria="Indumentaria">Indumentaria</button>
        <button class="chip" data-categoria="Otros">Otros</button>

    </div>

    <select id="filtroCategoria">
        <option value="">Todas las categorías</option>
        <option>Hogar</option>
        <option>Herramientas</option>
        <option>Electrónica</option>
        <option>Vehículos</option>
        <option>Deportes</option>
        <option>Indumentaria</option>
        <option>Otros</option>
    </select>

</section>

<!-- ==========================
     PUBLICACIONES
========================== -->

<section>

    <div id="publicaciones"></div>

</section>

<!-- ==========================
     FORMULARIO
========================== -->

<section class="formulario">

    <h2>Nueva publicación</h2>

    <label for="titulo">Título</label>
    <input id="titulo" placeholder="Ej: Bicicleta rodado 29">

    <label for="estado">Estado</label>

    <select id="estado">
        <option value="">Seleccione estado</option>
        <option>Nuevo</option>
        <option>Usado</option>
    </select>

    <label for="categoria">Categoría</label>

    <select id="categoria">
        <option value="">Seleccione una categoría</option>
        <option>Hogar</option>
        <option>Herramientas</option>
        <option>Electrónica</option>
        <option>Vehículos</option>
        <option>Deportes</option>
        <option>Indumentaria</option>
        <option>Otros</option>
    </select>

    <label for="busca">¿Qué buscás?</label>
    <input id="busca" placeholder="Ej: Notebook, herramientas, etc.">

    <label for="imagen">Imagen</label>
    <input type="file" id="imagen" accept="image/*">

    <button id="btnPublicar">Publicar</button>

</section>

<!-- ==========================
     MODAL
========================== -->

<div id="modal" class="modal">

    <div class="modal-contenido">

        <span id="cerrarModal">&times;</span>

        <img id="modalImagen">

        <h2 id="modalTitulo"></h2>

        <p id="modalEstado"></p>

        <p id="modalCategoria"></p>

        <p id="modalBusca"></p>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="script.js"></script>

</body>
</html>
