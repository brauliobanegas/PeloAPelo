<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TruequeAR</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <header class="encabezado">

    <h1 class="logo">
    <span class="logoTrueque">Trueque</span><span class="logoAR">AR</span>
</h1>

    <p>Cambialo y hacelo útil</p>

</header>

    <section class="formulario">

    <h2>Nueva publicación</h2>

    <input id="titulo" placeholder="Título"><br><br>

    <input id="estado" placeholder="Estado">

    <select id="categoria">
    <option value="">Seleccione una categoría</option>
    <option>Hogar</option>
    <option>Herramientas</option>
    <option>Electrónica</option>
    <option>Vehículos</option>
    <option>Deportes</option>
    <option>Otros</option>
    </select>
    <br><br>

    <input id="busca" placeholder="¿Qué buscás?"><br><br>

    <input type="file" id="imagen" accept="image/*"><br><br>

    <button id="btnPublicar">Publicar</button>

    <hr>

    <input id="buscador" placeholder="Buscar publicaciones..." style="width:100%; padding:8px;">
    <br><br>

    <select id="filtroCategoria">
    <option value="">Todas las categorías</option>
    <option>Hogar</option>
    <option>Herramientas</option>
    <option>Electrónica</option>
    <option>Vehículos</option>
    <option>Deportes</option>
    <option>Indumentaria</option>
    <option>Otros</option>
    </select>
    <br><br>

    </section>

    <section>

    <div id="publicaciones"></div>

    </section>

<div id="modal" class="modal">

    <div class="modal-contenido">

        <span id="cerrarModal">&times;</span>

        <img id="modalImagen">

        <h2 id="modalTitulo"></h2>

        <p id="modalEstado"></p>

        <p id="modalCategoria"></p>

        <p id="modalBusca"></p>

    </div>

</div>

    <script src="script.js"></script>

</body>
</html>
