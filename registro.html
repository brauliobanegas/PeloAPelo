<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - TruequeAR</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="contenedorCuenta">

    <div class="marcaCuenta">

        <h1>
            <span class="logoTrueque">Trueque</span><span class="logoAR">AR</span>
        </h1>

        <p>
            Segundas vidas. Nuevos tesoros
        </p>

    </div>


    <div class="tarjetaCuenta">

        <h2>Crear cuenta</h2>


        <form id="formRegistro">

            <label>
                Nombre:
                <input type="text" id="nombre" required>
            </label>


            <label>
                Email:
                <input type="email" id="email" required>
            </label>


            <label>
                Contraseña:
                <input type="password" id="password" required>
            </label>


            <label>
                Teléfono:
                <input type="text" id="telefono">
            </label>


            <button type="submit">
                Registrarme
            </button>

        </form>


        <p id="mensaje"></p>

        <p class="enlaceCuenta">
            ¿Ya tenés cuenta?
            <a href="login.html">Ingresar</a>
        </p>


    </div>


</div>


<!-- Librería Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="registro.js"></script>


</body>
</html>
