<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - PeloAPelo</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="contenedorCuenta">

    <div class="marcaCuenta">

        <h1 class="logo">
            <span class="logoCeleste">Pe</span><span class="logoBlanco">lo</span><span class="logoAmarillo">A</span><span class="logoBlanco">Pe</span><span class="logoCeleste">lo</span>
        </h1>

        <p class="eslogan">
            Segundas vidas. Nuevos tesoros
        </p>

    </div>


    <div class="tarjetaCuenta">

        <h2>Crear cuenta</h2>


        <form id="formRegistro">

            <label>
                Nombre:
                <input type="text" id="nombre" required>
            </label>

            <label>
                Apellido:
                <input type="text" id="apellido" required>
            </label>


            <label>
                Email:
                <input type="email" id="email" required>
            </label>


            <label>
                Contraseña:

                <div class="campoPassword">

                    <input type="password" id="password" required>

                    <button type="button" id="mostrarPassword">
                        👁
                    </button>

                </div>

            </label>


            <label>
                Teléfono:
                <input type="text" id="telefono">
            </label>


            <label class="aceptar-terminos">

                <input type="checkbox" id="aceptoTerminos">

                Acepto los 
                <a href="terminos.html" target="_blank">
                    Términos y Condiciones de uso de TruequeAR
                </a>

            </label>


            <button type="submit" id="btnRegistro" disabled>
                Registrarme
            </button>

        </form>


        <p id="mensaje"></p>

        <p class="enlaceCuenta">
            ¿Ya tenés cuenta?
            <a href="login.html">Ingresar</a>
        </p>


    </div>


</div>


<!-- Librería Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="registro.js"></script>


</body>
</html>
