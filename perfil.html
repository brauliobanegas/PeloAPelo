<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mi Perfil - PeloAPelo</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="encabezado">

    <h1 class="logo">
        <span class="logoTrueque">Trueque</span><span class="logoAR">AR</span>
    </h1>

</header>

<button id="btnVolverInicio">
    ⬅ Volver al inicio
</button>


<section class="perfil-contenedor">

    <h2>Mi Perfil</h2>

    <p>Email:</p>

    <p id="emailUsuario">
    Cargando...
    </p>

    <p>Nombre:</p>

<p id="nombreUsuario">
    Cargando...
</p>

<input id="inputNombre" style="display:none;">


<p>Teléfono:</p>

<p id="telefonoUsuario">
    Cargando...
</p>

<input id="inputTelefono" style="display:none;">

<button id="btnEditarPerfil">
    Editar perfil
</button>

<button id="btnGuardarPerfil" style="display:none;">
    Guardar cambios
</button>

<button id="btnCancelarPerfil" style="display:none;">
    Cancelar
</button>

<hr>

<h3>Mis publicaciones</h3>

<div id="misPublicaciones">

    Cargando publicaciones...

</div>

<hr>

<h3>Solicitudes de intercambio</h3>

<div id="solicitudesIntercambio">

    Cargando solicitudes...

</div>

</section>

<div id="toast" class="toast"></div>
<div id="modalContacto" class="modal">

    <div class="modal-contenido">

        <span id="cerrarModalContacto">&times;</span>

        <h2>Datos de contacto</h2>

        <p id="contactoNombre"></p>

        <p id="contactoTelefono"></p>

        <p id="contactoEmail"></p>

    </div>

</div>
<div id="modalImagenPerfil" class="modal">

    <div class="modal-contenido imagen-grande">

        <span id="cerrarImagenPerfil">&times;</span>

        <img id="imagenPerfilGrande">

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script defer src="perfil.js"></script>

</body>

</html>
